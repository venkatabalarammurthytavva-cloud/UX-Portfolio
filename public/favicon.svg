<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Deep dark slate matching portfolio #0D0D0E with smooth rounded rect -->
  <rect width="512" height="512" rx="112" fill="#0D0D0E" />
  <!-- Subtle border matching portfolio card border #27272a -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="16" stroke-opacity="0.8" />
  
  <!-- Monogram TB -->
  <!-- "T": High-contrast crisp white crossbar and stem with optical balance -->
  <!-- Top bar of T -->
  <path d="M 64 128 L 272 128 L 272 192 L 196 192 L 196 384 L 132 384 L 132 192 L 64 192 Z" fill="#FFFFFF" />
  
  <!-- "B": Distinct geometric form with subtle emerald accent cut on the upper lobe or crisp pure white -->
  <!-- Back spine of B -->
  <path d="M 288 128 L 400 128 C 438 128 464 150 464 186 C 464 214 444 236 418 244 C 452 254 472 280 472 316 C 472 358 440 384 396 384 L 288 384 Z M 352 186 L 352 228 L 392 228 C 408 228 418 218 418 207 C 418 196 408 186 392 186 Z M 352 284 L 352 326 L 396 326 C 414 326 424 316 424 305 C 424 294 414 284 396 284 Z" fill="#FFFFFF" />
  
  <!-- Subtle emerald dot / design system accent dot at bottom right honoring Tavva Balaram's emerald interactive signature (#10b981 / #34d399) -->
  <circle cx="440" cy="384" r="22" fill="#10B981" />
</svg>
